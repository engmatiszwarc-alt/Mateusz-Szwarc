<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="avatarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1726"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="neonRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ff007f"/>
    </linearGradient>
    <filter id="avatarGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#avatarBg)"/>
  <circle cx="100" cy="100" r="92" fill="none" stroke="url(#neonRing)" stroke-width="3" filter="url(#avatarGlow)"/>

  <!-- Developer Silhouette / Character -->
  <!-- Shoulders -->
  <path d="M 45 180 C 45 140, 70 135, 100 135 C 130 135, 155 140, 155 180 Z" fill="#334155"/>
  <path d="M 60 180 C 65 150, 80 145, 100 145 C 120 145, 135 150, 140 180 Z" fill="#1e293b"/>

  <!-- Neck -->
  <rect x="88" y="115" width="24" height="25" fill="#e2e8f0" rx="3"/>

  <!-- Head -->
  <ellipse cx="100" cy="90" rx="32" ry="36" fill="#f8fafc"/>

  <!-- Hair / Hood -->
  <path d="M 65 90 C 65 55, 135 55, 135 90 C 135 65, 120 52, 100 52 C 80 52, 65 65, 65 90 Z" fill="#0f172a"/>

  <!-- Cyber Visor / Headset -->
  <rect x="68" y="78" width="64" height="18" rx="4" fill="#090d16" stroke="#00f3ff" stroke-width="2" filter="url(#avatarGlow)"/>
  <line x1="72" y1="87" x2="128" y2="87" stroke="#00f3ff" stroke-width="3"/>
  <circle cx="122" cy="87" r="3" fill="#ff007f"/>

  <!-- Gamer Headphones -->
  <rect x="62" y="75" width="8" height="28" rx="3" fill="#8b5cf6"/>
  <rect x="130" y="75" width="8" height="28" rx="3" fill="#8b5cf6"/>
  <path d="M 66 75 C 66 45, 134 45, 134 75" fill="none" stroke="#64748b" stroke-width="4"/>

  <!-- Level 99 Badge -->
  <rect x="70" y="165" width="60" height="18" rx="9" fill="#0b0f19" stroke="#00f3ff" stroke-width="1.5"/>
  <text x="100" y="178" fill="#00f3ff" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="9" text-anchor="middle">LVL 99 DEV</text>
</svg>
