<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="50%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#0b0f17"/>
    </linearGradient>
    <radialGradient id="sphereGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#6366f1"/>
      <stop offset="90%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </radialGradient>
    <linearGradient id="wireframeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="shaderGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="800" height="450" fill="url(#darkBg)"/>

  <!-- Code Matrix Ambient Texture -->
  <g fill="#475569" opacity="0.3" font-family="monospace" font-size="11">
    <text x="40" y="80">float4 PS_Stylized(VS_OUT input) : SV_Target {</text>
    <text x="60" y="105">float3 normal = normalize(input.Normal);</text>
    <text x="60" y="130">float NdotL = saturate(dot(normal, _LightDir));</text>
    <text x="60" y="155">float ramp = smoothstep(0.48, 0.52, NdotL);</text>
    <text x="60" y="180">float3 rim = pow(1.0 - saturate(dot(normal, viewDir)), _RimPower);</text>
    <text x="40" y="205">}</text>

    <text x="500" y="80">#pragma vertex vert</text>
    <text x="500" y="105">#pragma fragment frag</text>
    <text x="500" y="130">#include "Packages/com.unity.render-pipelines"</text>
    <text x="500" y="155">half4 LitPassFragment(...) {</text>
    <text x="520" y="180">return half4(color + caustics, 1.0);</text>
    <text x="500" y="205">}</text>
  </g>

  <!-- Left: Shaded Sphere / Right: Wireframe split -->
  <g transform="translate(400, 200)">
    <!-- Base Shaded Sphere -->
    <circle cx="0" cy="0" r="105" fill="url(#sphereGrad)" filter="url(#shaderGlow)"/>

    <!-- Caustic highlight rings -->
    <ellipse cx="-20" cy="-25" rx="75" ry="40" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.5" transform="rotate(-30)"/>
    <ellipse cx="-15" cy="-20" rx="40" ry="20" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.8" transform="rotate(-25)"/>
    <circle cx="-35" cy="-40" r="12" fill="#ffffff" opacity="0.9" filter="url(#shaderGlow)"/>

    <!-- Wireframe Lat/Long overlay -->
    <ellipse cx="0" cy="0" rx="105" ry="35" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.5"/>
    <ellipse cx="0" cy="0" rx="105" ry="75" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.3"/>
    <ellipse cx="0" cy="0" rx="35" ry="105" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.5"/>
    <ellipse cx="0" cy="0" rx="75" ry="105" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.3"/>
    <circle cx="0" cy="0" r="105" fill="none" stroke="#38bdf8" stroke-width="2"/>

    <!-- Orbiting Energy Ring -->
    <ellipse cx="0" cy="0" rx="150" ry="45" fill="none" stroke="url(#wireframeGrad)" stroke-width="3" filter="url(#shaderGlow)" stroke-dasharray="14 10" transform="rotate(25)"/>
  </g>

  <!-- GitHub Stars Pill -->
  <g transform="translate(340, 320)">
    <rect width="120" height="28" rx="14" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5"/>
    <polygon points="18,14 21,8 24,14 30,15 25,19 27,25 21,21 16,25 17,19 13,15" fill="#fbbf24"/>
    <text x="36" y="19" fill="#f8fafc" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12">1.2k Stars</text>
  </g>

  <!-- Title Badge Overlay -->
  <rect x="230" y="380" width="340" height="42" rx="6" fill="#030712" stroke="#6366f1" stroke-width="1.5" opacity="0.95"/>
  <text x="400" y="406" fill="#818cf8" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="16" letter-spacing="3" text-anchor="middle">NOVASHADER VFX SUITE</text>
  <text x="400" y="434" fill="#93c5fd" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" letter-spacing="1.5" text-anchor="middle">HLSL / GLSL • CROSS-ENGINE TOOLKIT</text>
</svg>
