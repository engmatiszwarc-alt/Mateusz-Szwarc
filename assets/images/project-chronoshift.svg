<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="50%" stop-color="#0e172a"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="cyanNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f3ff"/>
      <stop offset="100%" stop-color="#0066ff"/>
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7928ca"/>
      <stop offset="100%" stop-color="#ff0080"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="800" height="450" fill="url(#bgGrad)"/>
  
  <!-- Cyberpunk grid perspective -->
  <g opacity="0.3" stroke="#00f3ff" stroke-width="1">
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="0" y1="385" x2="800" y2="385"/>
    <line x1="0" y1="415" x2="800" y2="415"/>
    <line x1="0" y1="450" x2="800" y2="450"/>
    <line x1="400" y1="280" x2="0" y2="450"/>
    <line x1="400" y1="280" x2="200" y2="450"/>
    <line x1="400" y1="280" x2="400" y2="450"/>
    <line x1="400" y1="280" x2="600" y2="450"/>
    <line x1="400" y1="280" x2="800" y2="450"/>
  </g>

  <!-- Distant City Silhouette -->
  <path d="M 50 320 L 70 320 L 70 250 L 100 250 L 100 320 L 140 320 L 140 220 L 170 220 L 190 270 L 220 270 L 220 320 L 580 320 L 580 240 L 610 240 L 610 290 L 650 290 L 650 210 L 690 210 L 710 320 Z" fill="#131b2e" opacity="0.7"/>

  <!-- Temporal Ring / Chrono Dial -->
  <circle cx="400" cy="200" r="120" fill="none" stroke="url(#cyanNeon)" stroke-width="2" opacity="0.4" stroke-dasharray="6 8"/>
  <circle cx="400" cy="200" r="95" fill="none" stroke="#00f3ff" stroke-width="3" filter="url(#glow)"/>
  <circle cx="400" cy="200" r="70" fill="#0f172a" stroke="url(#accentGlow)" stroke-width="2" opacity="0.8"/>
  
  <!-- Clock ticks & temporal rewind arcs -->
  <path d="M 400 130 A 70 70 0 0 1 470 200" fill="none" stroke="#00f3ff" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M 400 270 A 70 70 0 0 1 330 200" fill="none" stroke="#ff0080" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Center Hologram Glyph -->
  <polygon points="400,165 430,215 370,215" fill="none" stroke="#00f3ff" stroke-width="2" filter="url(#glow)"/>
  <circle cx="400" cy="198" r="8" fill="#00f3ff" filter="url(#glow)"/>

  <!-- Title Badge Overlay -->
  <rect x="250" y="370" width="300" height="42" rx="6" fill="#0b1120" stroke="#00f3ff" stroke-width="1.5" opacity="0.95"/>
  <text x="400" y="396" fill="#00f3ff" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="16" letter-spacing="3" text-anchor="middle">CHRONOSHIFT: ODYSSEY</text>
  <text x="400" y="425" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" letter-spacing="1.5" text-anchor="middle">UNREAL ENGINE 5 • C++ ROGUELIKE</text>
</svg>
