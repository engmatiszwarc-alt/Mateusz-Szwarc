<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="synthSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d0221"/>
      <stop offset="45%" stop-color="#240046"/>
      <stop offset="70%" stop-color="#5a189a"/>
      <stop offset="100%" stop-color="#0f051d"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff9e00"/>
      <stop offset="50%" stop-color="#ff007f"/>
      <stop offset="100%" stop-color="#7b2cbf"/>
    </linearGradient>
    <linearGradient id="racerGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="100%" stop-color="#7b2cbf"/>
    </linearGradient>
    <filter id="synthGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="800" height="450" fill="url(#synthSky)"/>

  <!-- Synthwave Sun -->
  <circle cx="400" cy="220" r="90" fill="url(#sunGrad)" filter="url(#synthGlow)"/>
  <!-- Sun horizontal cut lines -->
  <line x1="310" y1="230" x2="490" y2="230" stroke="#0d0221" stroke-width="3"/>
  <line x1="315" y1="242" x2="485" y2="242" stroke="#0d0221" stroke-width="4"/>
  <line x1="325" y1="256" x2="475" y2="256" stroke="#0d0221" stroke-width="5"/>
  <line x1="340" y1="272" x2="460" y2="272" stroke="#0d0221" stroke-width="6"/>

  <!-- Perspective Neon Grid -->
  <g stroke="#ff007f" stroke-width="1.5" opacity="0.6">
    <line x1="0" y1="290" x2="800" y2="290"/>
    <line x1="0" y1="310" x2="800" y2="310"/>
    <line x1="0" y1="340" x2="800" y2="340"/>
    <line x1="0" y1="380" x2="800" y2="380"/>
    <line x1="0" y1="435" x2="800" y2="435"/>
    <line x1="400" y1="280" x2="-200" y2="450"/>
    <line x1="400" y1="280" x2="50" y2="450"/>
    <line x1="400" y1="280" x2="250" y2="450"/>
    <line x1="400" y1="280" x2="400" y2="450"/>
    <line x1="400" y1="280" x2="550" y2="450"/>
    <line x1="400" y1="280" x2="750" y2="450"/>
    <line x1="400" y1="280" x2="1000" y2="450"/>
  </g>

  <!-- Speed Thruster Trails -->
  <polygon points="340,320 200,310 330,328" fill="#00f5d4" opacity="0.8" filter="url(#synthGlow)"/>
  <polygon points="460,320 600,310 470,328" fill="#00f5d4" opacity="0.8" filter="url(#synthGlow)"/>

  <!-- Anti-Gravity Hover Racer Ship Silhouette -->
  <polygon points="400,280 435,325 460,325 435,335 365,335 340,325 365,280" fill="#10002b" stroke="#00f5d4" stroke-width="2.5" filter="url(#synthGlow)"/>
  <polygon points="400,285 415,310 385,310" fill="#00f5d4" opacity="0.9"/>
  <ellipse cx="400" cy="333" rx="25" ry="4" fill="#ff007f" filter="url(#synthGlow)"/>

  <!-- Title Badge Overlay -->
  <rect x="230" y="375" width="340" height="42" rx="6" fill="#0d0221" stroke="#ff007f" stroke-width="1.5" opacity="0.95"/>
  <text x="400" y="401" fill="#ff007f" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="16" letter-spacing="3" text-anchor="middle">HYPER OVERDRIVE 2088</text>
  <text x="400" y="430" fill="#00f5d4" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" letter-spacing="1.5" text-anchor="middle">GODOT 4.2 • HIGH-SPEED ARCADE RACER</text>
</svg>
