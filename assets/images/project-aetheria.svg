<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="40%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="crystalGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="goldBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="prismGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="800" height="450" fill="url(#skyGrad)"/>

  <!-- Stars / Nebulae -->
  <g fill="#ffffff" opacity="0.6">
    <circle cx="80" cy="80" r="1.5"/>
    <circle cx="150" cy="40" r="1"/>
    <circle cx="280" cy="90" r="2"/>
    <circle cx="520" cy="50" r="1.5"/>
    <circle cx="680" cy="70" r="2"/>
    <circle cx="730" cy="130" r="1"/>
    <circle cx="210" cy="180" r="1"/>
    <circle cx="620" cy="200" r="1.5"/>
  </g>

  <!-- Floating Island Center -->
  <path d="M 280 270 L 520 270 L 580 300 L 460 380 L 340 370 L 220 300 Z" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <path d="M 280 270 L 400 280 L 520 270 L 400 290 Z" fill="#334155"/>

  <!-- Ancient Monolith Pillars -->
  <polygon points="320,180 340,175 345,270 325,270" fill="#475569"/>
  <polygon points="460,180 480,175 475,270 455,270" fill="#475569"/>

  <!-- Levitating Prismatic Crystal -->
  <polygon points="400,100 440,180 400,240 360,180" fill="url(#crystalGlow)" filter="url(#prismGlow)" opacity="0.9"/>
  <polygon points="400,100 440,180 400,200" fill="#ffffff" opacity="0.4"/>
  <polygon points="400,200 440,180 400,240" fill="#6366f1" opacity="0.6"/>

  <!-- Light Beams passing through prism -->
  <line x1="80" y1="180" x2="360" y2="180" stroke="url(#goldBeam)" stroke-width="3" opacity="0.8" stroke-dasharray="8 4"/>
  <line x1="440" y1="180" x2="720" y2="120" stroke="#38bdf8" stroke-width="2.5" opacity="0.9" filter="url(#prismGlow)"/>
  <line x1="440" y1="180" x2="730" y2="180" stroke="#818cf8" stroke-width="2" opacity="0.8" filter="url(#prismGlow)"/>
  <line x1="440" y1="180" x2="720" y2="240" stroke="#c084fc" stroke-width="2.5" opacity="0.9" filter="url(#prismGlow)"/>

  <!-- Floating Rings around crystal -->
  <ellipse cx="400" cy="180" rx="65" ry="20" fill="none" stroke="#fbbf24" stroke-width="1.5" opacity="0.7" transform="rotate(-15 400 180)"/>

  <!-- Badge Overlay -->
  <rect x="250" y="375" width="300" height="42" rx="6" fill="#090d16" stroke="#818cf8" stroke-width="1.5" opacity="0.95"/>
  <text x="400" y="401" fill="#c084fc" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="16" letter-spacing="3" text-anchor="middle">ECHOES OF AETHERIA</text>
  <text x="400" y="430" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" letter-spacing="1.5" text-anchor="middle">UNITY 2023 LTS • URP &amp; HLSL</text>
</svg>
